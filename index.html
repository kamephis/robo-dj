<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Robo DJ – ein niedlicher 3D-Roboter legt in Präsentationspausen auf.">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<title>Robo DJ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D club stage; pause banner floats top-center for the audience; a glass control deck docks at the bottom for the presenter and can be hidden. */
:root{
  --night:#0e0a1f;
  --deck:rgba(23,17,46,.84);
  --line:rgba(198,180,255,.17);
  --ink:#f5f1ff;
  --muted:#aaa1d0;
  --candy:#ff5fa2;
  --mint:#5ff2c8;
  --sun:#ffd35c;
  --f-display:'Fredoka','Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-display);font-size:15px;overflow:hidden}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
.strobe{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:1}

/* top bar */
.top{position:fixed;inset:0 0 auto 0;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.top > *{pointer-events:auto}
.brand{display:flex;flex-direction:column;gap:6px;justify-self:start}
.logo{font-weight:700;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 3px rgba(255,255,255,.06);transition:background .2s}
body.playing .logo i{background:var(--mint);box-shadow:0 0 12px var(--mint);animation:pulse calc(60s / var(--bpm,124)) infinite}
@keyframes pulse{0%{transform:scale(1.25)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.np{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.np b{color:var(--ink);font-weight:500}
.banner{text-align:center;justify-self:center;max-width:min(760px,92vw);pointer-events:none}
.banner h1{margin:0;font-weight:600;font-size:clamp(30px,4.8vw,68px);line-height:1.02;text-wrap:balance;
  text-shadow:0 0 28px rgba(255,95,162,.55),0 2px 0 rgba(0,0,0,.35)}
.banner p{margin:8px 0 0;font-family:var(--f-mono);font-size:clamp(14px,1.6vw,20px);color:var(--mint);font-variant-numeric:tabular-nums;letter-spacing:.03em;
  text-shadow:0 0 14px rgba(95,242,200,.45)}
.banner.done h1{color:var(--sun);text-shadow:0 0 30px rgba(255,211,92,.6)}
.view{justify-self:end;display:flex;gap:6px}

/* deck */
.dock{position:fixed;inset:auto 0 0 0;z-index:3;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s}
.deck{max-width:1320px;margin:0 auto;background:var(--deck);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:22px;padding:14px 16px 12px;display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-start;
  max-height:46vh;overflow-y:auto;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.grp{display:flex;flex-direction:column;gap:8px;min-width:0}
.grp h2{margin:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hint{flex-basis:100%;margin:0;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.hint kbd{font-family:inherit;color:var(--ink);background:rgba(255,255,255,.07);border-radius:5px;padding:1px 5px}

button,select,input{font:inherit;color:inherit}
.chip{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--ink);font-size:14px;font-weight:500;
  padding:7px 13px;border-radius:999px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.chip:hover{border-color:rgba(95,242,200,.55)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--candy);border-color:transparent;color:#22071a}
.chip.fx[aria-pressed="true"]{background:var(--mint);color:#06231b}
.chip:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

.play{appearance:none;border:0;width:54px;height:54px;border-radius:50%;background:var(--mint);color:#08241c;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 0 0 5px rgba(95,242,200,.16),0 0 26px rgba(95,242,200,.45);transition:transform .12s}
.play:active{transform:scale(.94)}
.play svg{width:22px;height:22px}
.play .i-pause{display:none}
body.playing .play{background:var(--candy);color:#2a0919;box-shadow:0 0 0 5px rgba(255,95,162,.18),0 0 26px rgba(255,95,162,.5)}
body.playing .play .i-play{display:none}
body.playing .play .i-pause{display:block}
.music{display:flex;gap:14px;align-items:center}
.sliders{display:grid;grid-template-columns:auto minmax(90px,130px) 3.2em;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.sliders output{font-family:var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;font-size:12px}
input[type=range]{accent-color:var(--candy);width:100%;margin:0}

.pad{appearance:none;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:76px;text-align:left;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));color:var(--ink);font-size:13.5px;font-weight:500;
  box-shadow:inset 0 -3px 0 var(--pc,var(--sun));transition:transform .08s,filter .15s}
.pad small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-weight:400}
.pad:hover{filter:brightness(1.2)}
.pad.hit{transform:translateY(2px) scale(.97);box-shadow:inset 0 -1px 0 var(--pc),0 0 18px var(--pc)}

.field{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;min-width:0}
input.field{width:170px}
select.field{padding-right:6px}

/* stage mode: hide controls */
body.stage .dock{transform:translateY(calc(100% + 20px));opacity:0;pointer-events:none}
body.stage .brand,body.stage .view{opacity:0;pointer-events:none}
.brand,.view{transition:opacity .3s}
.peek{position:fixed;z-index:4;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  opacity:0;pointer-events:none;transition:opacity .3s}
body.stage .peek{pointer-events:auto;opacity:.06}
body.stage.wake .peek,body.stage .peek:focus-visible,body.stage .peek:hover{opacity:1}

@media (max-width:720px){
  .top{grid-template-columns:1fr auto;grid-template-areas:"brand view" "banner banner"}
  .brand{grid-area:brand}.view{grid-area:view}.banner{grid-area:banner}
  .deck{gap:12px 18px}
  input.field{width:140px}
}
@media (prefers-reduced-motion:reduce){
  body.playing .logo i{animation:none}
  .dock,.chip,.pad{transition:none}
}
</style>

</head>
<body>
<canvas id="stage" aria-label="3D-Bühne: ein niedlicher Roboter legt hinter einem DJ-Pult mit zwei Plattenspielern auf"></canvas>
<div class="strobe" id="strobe"></div>

<header class="top">
  <div class="brand">
    <div class="logo"><i></i>Robo DJ</div>
    <div class="np" id="np"><b id="npStyle">House</b> · <span id="npBpm">124</span> BPM · Takt <span id="npBar">–</span><span id="npPart"></span></div>
  </div>
  <div class="banner" id="banner" aria-live="polite">
    <h1 id="bannerTitle">Kurze Pause</h1>
    <p id="bannerSub">Gleich geht’s weiter</p>
  </div>
  <div class="view">
    <button class="chip" id="btnFull" title="Vollbild (F)">Vollbild</button>
    <button class="chip" id="btnHide" title="Steuerung ausblenden (H)">Steuerung aus</button>
  </div>
</header>

<div class="dock">
  <div class="deck" role="group" aria-label="Steuerung">
    <section class="grp">
      <h2>Musik</h2>
      <div class="music">
        <button class="play" id="btnPlay" aria-label="Musik starten" title="Play / Pause (Leertaste)">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="currentColor"/></svg>
        </button>
        <div class="grp">
          <div class="row" role="group" aria-label="Stil">
            <button class="chip" data-style="house" aria-pressed="true">House</button>
            <button class="chip" data-style="retro" aria-pressed="false">Retro-Disco</button>
            <button class="chip" data-style="lofi" aria-pressed="false">Lo-Fi</button>
            <button class="chip" data-style="funk" aria-pressed="false">Funk</button>
            <button class="chip" data-style="pop" aria-pressed="false">Pop</button>
            <button class="chip fx" id="btnSet" aria-pressed="true" title="Spielt eigene Tracks auf 4-Chord-Basis als durchgehendes Set (J)">DJ-Set</button>
            <button class="chip" id="btnNext" title="Zum nächsten Track springen (Taste .)">Nächster Track</button>
            <button class="chip fx" id="btnMix" aria-pressed="false" title="Wechselt alle 32 Takte automatisch den Stil (M)">Auto-Mix</button>
          </div>
          <div class="sliders">
            <label for="sTempo">Tempo</label><input type="range" id="sTempo" min="70" max="140" value="124"><output id="oTempo">124</output>
            <label for="sVol">Lautstärke</label><input type="range" id="sVol" min="0" max="100" value="75"><output id="oVol">75 %</output>
            <label for="sFilter" title="Links: Tiefpass · Mitte: aus · Rechts: Hochpass">DJ-Filter</label><input type="range" id="sFilter" min="-100" max="100" value="0"><output id="oFilter">aus</output>
          </div>
        </div>
      </div>
    </section>

    <section class="grp">
      <h2>Tanz</h2>
      <div class="row" style="max-width:330px">
        <button class="chip" data-move="auto" aria-pressed="true" title="1">Auto</button>
        <button class="chip" data-move="dj" aria-pressed="false" title="2">Auflegen</button>
        <button class="chip" data-move="hands" aria-pressed="false" title="3">Hände hoch</button>
        <button class="chip" data-move="robot" aria-pressed="false" title="4">Robot Dance</button>
        <button class="chip" data-move="headbang" aria-pressed="false" title="5">Headbang</button>
        <button class="chip" data-move="spin" aria-pressed="false" title="6">Pirouette</button>
        <button class="chip" data-move="wave" aria-pressed="false" title="7">Winken</button>
        <button class="chip" data-move="fever" aria-pressed="false" title="8">Disco-Finger</button>
      </div>
    </section>

    <section class="grp">
      <h2>Licht &amp; Effekte</h2>
      <div class="row" style="max-width:330px">
        <button class="chip fx" data-fx="lights" aria-pressed="true" title="S">Lichtshow</button>
        <button class="chip fx" data-fx="wall" aria-pressed="true" title="W">LED-Wand</button>
        <button class="chip fx" data-fx="lasers" aria-pressed="false" title="L">Laser</button>
        <button class="chip fx" data-fx="disco" aria-pressed="false" title="D">Discokugel</button>
        <button class="chip fx" data-fx="fog" aria-pressed="false" title="N">Nebel</button>
        <button class="chip fx" data-fx="strobe" aria-pressed="false" id="btnStrobe" title="B · blitzt im Takt, max. ca. 2× pro Sekunde">Stroboskop</button>
      </div>
    </section>

    <section class="grp">
      <h2>FX-Pad</h2>
      <div class="row">
        <button class="pad" data-shot="confetti" style="--pc:var(--sun)">Konfetti<small>K</small></button>
        <button class="pad" data-shot="horn" style="--pc:var(--candy)">Air-Horn<small>A</small></button>
        <button class="pad" data-shot="scratch" style="--pc:var(--mint)">Scratch<small>X</small></button>
        <button class="pad" data-shot="drop" style="--pc:#9d8bff">Drop<small>R</small></button>
      </div>
    </section>

    <section class="grp">
      <h2>Pausen-Timer</h2>
      <div class="row">
        <label class="visually" for="iText" style="position:absolute;left:-9999px">Banner-Text</label>
        <input class="field" id="iText" maxlength="40" value="Kurze Pause" placeholder="Banner-Text">
        <label for="iMin" style="position:absolute;left:-9999px">Dauer</label>
        <select class="field" id="iMin">
          <option value="5">5 Min.</option>
          <option value="10" selected>10 Min.</option>
          <option value="15">15 Min.</option>
          <option value="20">20 Min.</option>
          <option value="30">30 Min.</option>
        </select>
        <button class="chip" id="btnTimer" aria-pressed="false">Timer starten</button>
      </div>
    </section>

    <section class="grp">
      <h2>Bühne</h2>
      <div class="row" role="group" aria-label="Setting">
        <button class="chip" data-scene="club" aria-pressed="true" title="G">Club</button>
        <button class="chip" data-scene="beach" aria-pressed="false" title="G">Strand</button>
        <button class="chip" data-scene="space" aria-pressed="false" title="G">Weltall</button>
      </div>
      <div class="row">
        <label for="iDesk" style="position:absolute;left:-9999px">Schriftzug am Pult</label>
        <input class="field" id="iDesk" maxlength="18" value="ROBO DJ" placeholder="Schriftzug am Pult" style="width:150px">
        <button class="chip" id="btnLogo" title="PNG, JPG oder SVG – wird statt des Schriftzugs am Pult gezeigt">Logo laden</button>
        <button class="chip" id="btnLogoX" hidden>Logo entfernen</button>
        <input type="file" id="iLogo" accept="image/*" hidden>
      </div>
    </section>

    <p class="hint"><kbd>Leertaste</kbd> Musik · <kbd>J</kbd> DJ-Set · <kbd>.</kbd> Nächster Track · <kbd>M</kbd> Auto-Mix · <kbd>1</kbd>–<kbd>8</kbd> Tanz · <kbd>K</kbd> <kbd>A</kbd> <kbd>X</kbd> <kbd>R</kbd> FX-Pad · <kbd>G</kbd> Bühne · <kbd>F</kbd> Vollbild · <kbd>H</kbd> Steuerung aus/an · Roboter anklicken = Boop</p>
  </div>
</div>
<button class="chip peek" id="btnPeek" title="Steuerung einblenden (H)">Steuerung</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const hash = n => { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); };
const store = {
  get(k, d) { try { const v = localStorage.getItem('robodj.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('robodj.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ------------------------------------------------------------------ renderer */
THREE.ColorManagement.legacyMode = false;
const canvas = $('#stage');
const R = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
R.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
R.outputEncoding = THREE.sRGBEncoding;
R.toneMapping = THREE.ACESFilmicToneMapping;
R.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0e0a1f');
scene.fog = new THREE.FogExp2('#0e0a1f', 0.03);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 80);

// soft studio environment for reflections
{
  const pm = new THREE.PMREMGenerator(R);
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(20, 20, 20), new THREE.MeshBasicMaterial({ color: '#241a48', side: THREE.BackSide })));
  const panel = (c, x, y, z, w, h) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); };
  panel('#ffffff', 0, 9, 2, 10, 6);
  panel('#ff7ab5', -9, 2, 0, 6, 8);
  panel('#6ff7d9', 9, 2, 0, 6, 8);
  panel('#fff1cc', 0, 3, 9, 10, 5);
  scene.environment = pm.fromScene(env, 0.04).texture;
}

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw && draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  return { c, g, t };
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

// rounded box: spherify the corners of a segmented box, normals = true rounded normals
function roundedBox(w, h, d, r, s = 6) {
  const g = new THREE.BoxGeometry(w, h, d, s, s, s);
  const p = g.attributes.position, n = g.attributes.normal;
  const ix = w / 2 - r, iy = h / 2 - r, iz = d / 2 - r;
  const v = new THREE.Vector3(), c = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    c.set(clamp(v.x, -ix, ix), clamp(v.y, -iy, iy), clamp(v.z, -iz, iz));
    v.sub(c).normalize();
    n.setXYZ(i, v.x, v.y, v.z);
    v.multiplyScalar(r).add(c);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  return g;
}
const mesh = (geo, mat) => new THREE.Mesh(geo, mat);
const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.4, metalness: 0.1 }, o));

const PAL = ['#ff5fa2', '#5ff2c8', '#ffd35c', '#9d8bff', '#62b6ff', '#ff8a5c'];

/* ------------------------------------------------------------------ lights */
const hemi = new THREE.HemisphereLight('#b9a8ff', '#1a1030', 0.75); scene.add(hemi);
const key = new THREE.DirectionalLight('#ffffff', 1.5); key.position.set(2, 6, 7); scene.add(key);
const rimA = new THREE.PointLight('#ff5fa2', 1.6, 9); rimA.position.set(-2.6, 3.2, -1.6); scene.add(rimA);
const rimB = new THREE.PointLight('#5ff2c8', 1.6, 9); rimB.position.set(2.6, 3.2, -1.6); scene.add(rimB);
const deskGlow = new THREE.PointLight('#9d8bff', 0.8, 5); deskGlow.position.set(0, 0.6, 2.2); scene.add(deskGlow);

/* ------------------------------------------------------------------ room */
const floor = mesh(new THREE.PlaneGeometry(40, 30), std('#140e2b', { roughness: 0.28, metalness: 0.45 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const backWall = mesh(new THREE.PlaneGeometry(40, 14), std('#120c28', { roughness: 0.9 }));
backWall.position.set(0, 7, -3.4); scene.add(backWall);

// dance floor tiles
const TX = 17, TZ = 9, TS = 0.6;
const tiles = new THREE.InstancedMesh(new THREE.BoxGeometry(TS - 0.05, 0.02, TS - 0.05), new THREE.MeshBasicMaterial({ color: '#ffffff' }), TX * TZ);
const tileBase = new THREE.Color('#1c1538'), tileCol = [], tileLvl = new Float32Array(TX * TZ);
{
  const o = new THREE.Object3D(); let i = 0;
  for (let z = 0; z < TZ; z++) for (let x = 0; x < TX; x++) {
    o.position.set((x - (TX - 1) / 2) * TS, 0.011, -2.2 + z * TS); o.updateMatrix();
    tiles.setMatrixAt(i, o.matrix); tiles.setColorAt(i, tileBase); tileCol.push(new THREE.Color(PAL[0])); i++;
  }
}
scene.add(tiles);

// LED wall
const WC = 36, WR = 12;
const wallFrame = mesh(roundedBox(9.6, 3.5, 0.2, 0.06, 2), std('#0b0818', { roughness: 0.6 }));
wallFrame.position.set(0, 2.35, -3.15); scene.add(wallFrame);
const wall = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.2, 0.2), new THREE.MeshBasicMaterial({ color: '#ffffff' }), WC * WR);
const wallLvl = new Float32Array(WC);
{

    if (e.breakdown && state.move === 'auto') state.autoMove = 'dj';
  } else if (e.kind === 'style') {
    $('#sTempo').value = A.bpm; $('#oTempo').textContent = A.bpm; applyFilter(); syncUI();
  } else if (e.kind === 'drop') {
    burstConfetti(); face.set('love', 2.4); punch = 1; kickPulse = 1;
    if (state.move === 'auto') state.autoMove = 'hands';
  }
}

/* ------------------------------------------------------------------ framing */
let topH = 120, dockH = 220, viewTop = 120, viewBottom = 220;
function measure() {
  const b = $('#banner').getBoundingClientRect(), d = $('.deck').getBoundingClientRect();
  topH = b.bottom + 8;
  dockH = document.body.classList.contains('stage') ? 0 : (innerHeight - d.top + 6);
}
function resize() {
  R.setSize(innerWidth, innerHeight, false);
  measure();
}
addEventListener('resize', resize);
if (window.ResizeObserver) { const ro = new ResizeObserver(measure); ro.observe($('.deck')); ro.observe($('#banner')); }
const camTarget = new THREE.Vector3(0, 1.62, 0.4);
function updateCamera(dt) {
  viewTop = damp(viewTop, topH, 6, dt); viewBottom = damp(viewBottom, dockH, 6, dt);
  const W = innerWidth, H = innerHeight;
  const delta = viewBottom - viewTop, Hf = H + Math.abs(delta), h = Math.max(H * 0.3, H - viewTop - viewBottom);
  camera.aspect = W / Hf;
  const tf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(1.95 * Hf / (h * tf), 3.55 / (tf * camera.aspect), 5.2) * (1 - punch * 0.035);
  const sway = RM ? 0 : Math.sin(time * 0.17) * 0.14;
  camera.position.set(camTarget.x + Math.sin(sway) * dist, camTarget.y + dist * 0.2, camTarget.z + Math.cos(sway) * dist);
  camera.lookAt(camTarget);
  camera.setViewOffset(W, Hf, 0, delta > 0 ? delta : 0, W, H);
  camera.updateProjectionMatrix();
}

/* ------------------------------------------------------------------ main loop */
const tmpC = new THREE.Color(), dummy = new THREE.Object3D(), tgt = new THREE.Vector3();
let last = performance.now(), npTick = 0;
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs; time += dt;
  const C = A.ctx, now = C ? C.currentTime : 0;
  if (C) while (A.events.length && A.events[0].t <= now) handleEvent(A.events.shift(), now);
  animBeat += dt * (A.playing ? A.bpm / 60 : 0.8);
  const bi = Math.floor(animBeat);
  if (bi !== lastBeatInt) { lastBeatInt = bi; onBeat(bi); }

  let energy = 0;
  if (A.playing && A.analyser) { A.analyser.getByteFrequencyData(freq); for (let i = 1; i < 10; i++) energy += freq[i]; energy /= 9 * 255; }
  E = damp(E, energy, 10, dt);
  I = damp(I, A.playing ? 1 : 0.4, 2, dt);
  kickPulse *= Math.exp(-dt * 7); snarePulse *= Math.exp(-dt * 8); punch *= Math.exp(-dt * 3);
  if (!A.playing) kickPulse = Math.max(kickPulse, 0.35 * Math.exp(-((animBeat % 1)) * 5));
  scratchT = Math.max(0, scratchT - dt);

  updateRobot(dt);
  if ((npTick += dt) > 1 / 24) { npTick = 0; drawChest(); }

  // turntables
  decks.forEach((d, i) => {
    const sp = A.playing ? TAU * 0.55 : 0;
    let s = sp;
    if (i === 0 && (scratchT > 0)) s = Math.sin(time * 40) * 14;
    else if (i === 0 && currentMove() === 'dj' && A.playing) s = sp + Math.sin(animBeat * TAU) * 2.5;
    d.platter.rotation.y -= s * dt;
    d.btn.material.color.set(A.playing && (bi % 2 === i) ? '#5ff2c8' : '#24413a');
  });
  knobs.forEach((k, i) => { k.rotation.y = Math.sin(time * 0.7 + i * 1.3) * 1.2 + J.B.hy * (i % 2); });
  leds.forEach(({ l, c, i }) => {
    const lv = A.playing ? clamp(E * 1.25 + (c ? 0.05 : 0) * Math.sin(time * 9), 0, 1) : 0.15 + 0.1 * Math.sin(time * 2 + c);
    const on = i / 8 < lv; l.material.color.set(on ? (i < 5 ? '#5ff2c8' : i < 7 ? '#ffd35c' : '#ff5fa2') : '#221d38');
  });
  stripMat.color.setHSL((time * 0.06 + 0.9) % 1, 0.9, 0.5 + kickPulse * 0.2);
  deskGlow.intensity = 0.5 + kickPulse * 1.2;
  speakers.forEach(sp => {
    sp.woofer.cone.position.z = 0.35 + kickPulse * 0.05; sp.woofer.cap.position.z = 0.33 + kickPulse * 0.06;
    sp.mid.cap.position.z = 0.33 + snarePulse * 0.03;
    sp.ringMat.color.setHSL((sp === speakers[0] ? 0.92 : 0.46), 0.9, 0.35 + kickPulse * 0.35);
  });

  // floor tiles
  for (let i = 0; i < tileLvl.length; i++) {
    tileLvl[i] *= Math.exp(-dt * (A.playing ? 3.2 : 1.8));
    const l = tileLvl[i]; tmpC.copy(tileBase).lerp(tileCol[i], l); tiles.setColorAt(i, tmpC);
  }
  tiles.instanceColor.needsUpdate = true;

  // LED wall
  const wallOn = state.fx.wall;
  for (let c = 0; c < WC; c++) {
    let v;
    if (!wallOn) v = 0;
    else if (A.playing) { const bin = 1 + Math.floor(Math.pow(c / WC, 1.8) * 220); v = freq[bin] / 255; v = clamp((v - 0.15) * 1.3, 0, 1); }
    else v = 0.2 + 0.14 * Math.sin(time * 1.6 + c * 0.35) + 0.06 * Math.sin(time * 2.7 - c * 0.6);
    wallLvl[c] = v > wallLvl[c] ? v : damp(wallLvl[c], v, 6, dt);
    const lit = wallLvl[c] * WR;
    for (let r = 0; r < WR; r++) {
      const idx = r * WC + c, f = clamp(lit - r, 0, 1);
      tmpC.set('#120d26'); if (f > 0) tmpC.lerp(wallRowCol[r], f * (A.playing ? 1 : 0.6));
      wall.setColorAt(idx, tmpC);
    }
  }
  wall.instanceColor.needsUpdate = true;
  rimA.intensity = 1.2 + kickPulse * 1.6; rimB.intensity = 1.2 + snarePulse * 1.6;

  // spotlights
  spots.forEach(s => {
    const on = state.fx.lights ? 1 : 0;
    const tx = Math.sin(time * 0.6 + s.i * 2.1) * 2.6, tz = 0.8 + Math.cos(time * 0.8 + s.i * 1.3) * 1.6;
    s.L.target.position.set(tx, 0, tz); s.L.target.updateMatrixWorld();
    s.L.intensity = damp(s.L.intensity, on * (2.2 + kickPulse * 2.5 * I), 6, dt);
    tgt.set(tx, 0, tz); s.cone.lookAt(tgt);
    const cu = s.cone.material.uniforms;
    cu.uOpacity.value = damp(cu.uOpacity.value, on * (0.07 + kickPulse * 0.07 * I), 6, dt);
    tmpC.copy(s.base).offsetHSL(((palShift * 0.13) % 1), 0, 0); s.L.color.copy(tmpC); cu.uColor.value.copy(tmpC);
    s.cone.visible = cu.uOpacity.value > 0.003;
  });
  // lasers
  lasers.forEach(({ m, side, i }) => {
    const u = m.material.uniforms; const target = state.fx.lasers ? 0.85 : 0;
    u.uOpacity.value = damp(u.uOpacity.value, target * (0.6 + 0.4 * kickPulse), 8, dt);
    m.visible = u.uOpacity.value > 0.01;
    if (!m.visible) return;
    const sw = Math.sin(time * 1.1 + i * 0.45 + (side > 0 ? 1.5 : 0));
    tgt.set(-side * (-1.5 + i * 1.5) + sw * 1.8, 0.4 + 1.3 * Math.sin(time * 0.7 + i * 0.6), 8);
    m.lookAt(tgt);
    u.uColor.value.set(((barNo + (side > 0 ? 1 : 0)) % 2) ? '#5ff2c8' : '#ff5fa2');
  });
  laserEmit.forEach(e => (e.visible = state.fx.lasers));
  // disco ball
  disco.position.y = damp(disco.position.y, state.fx.disco ? 3.45 : 7.2, 2.5, dt);
  disco.rotation.y += dt * 0.6; sparks.rotation.y = disco.rotation.y; sparks.position.y = disco.position.y;
  sparkMat.opacity = damp(sparkMat.opacity, state.fx.disco ? 0.95 : 0, 3, dt);
  sparks.visible = sparkMat.opacity > 0.01;
  // fog
  const fogOn = state.fx.fog;
  scene.fog.density = damp(scene.fog.density, SCENES[curScene].dens + (fogOn ? 0.03 : 0), 1.5, dt);
  fogSprites.forEach(sp => {
    sp.position.x += sp.userData.v * dt; if (sp.position.x > 7) sp.position.x = -7; if (sp.position.x < -7) sp.position.x = 7;
    sp.material.opacity = damp(sp.material.opacity, fogOn ? 0.16 * sp.userData.w : 0, 1.2, dt);
    sp.visible = sp.material.opacity > 0.003;
  });
  // confetti
  if (confettiLive > 0) {
    let live = 0;
    for (let i = 0; i < CN; i++) {
      if (cL[i] <= 0) continue;
      const j = i * 3;
      if (cP[j + 1] > 0.03) {
        cV[j + 1] = Math.max(-1.3, cV[j + 1] - 1.4 * dt);
        cP[j] += (cV[j] + Math.sin(time * 2.3 + i) * 0.35) * dt; cP[j + 1] += cV[j + 1] * dt; cP[j + 2] += cV[j + 2] * dt;
        cR[j] += cS[j] * dt; cR[j + 1] += cS[j + 1] * dt; cR[j + 2] += cS[j + 2] * dt;
      } else { cP[j + 1] = 0.03; cR[j] = -Math.PI / 2; cR[j + 1] = 0; cL[i] -= dt * 0.25; }
      dummy.position.set(cP[j], cP[j + 1], cP[j + 2]); dummy.rotation.set(cR[j], cR[j + 1], cR[j + 2]);
      dummy.scale.setScalar(cL[i] > 0 ? Math.min(1, cL[i] * 3) : 0); dummy.updateMatrix(); confetti.setMatrixAt(i, dummy.matrix);
      if (cL[i] > 0) live++;
    }
    confetti.instanceMatrix.needsUpdate = true; confettiLive = live;
  }
  // strobe
  strobeA *= Math.exp(-dt * 16); strobeEl.style.opacity = strobeA.toFixed(3);

  updateScenery(dt, bi);
  updateTimer();
  updateCamera(dt);
  R.render(scene, camera);
  requestAnimationFrame(frame);
}
const strobeEl = $('#strobe');

/* ------------------------------------------------------------------ timer */
const bannerTitle = $('#bannerTitle'), bannerSub = $('#bannerSub'), banner = $('#banner');
let lastSub = '';
function fmt(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function updateTimer() {
  const T = state.timer; let sub;
  if (T.running) {
    const left = T.endAt - Date.now();
    if (left <= 0) { finishTimer(); return; }
    const at = new Date(T.endAt).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
    sub = `Weiter in ${fmt(left)} · um ${at} Uhr`;
  } else if (T.done) sub = 'Die Pause ist vorbei';
  else sub = 'Gleich geht’s weiter';
  if (sub !== lastSub) { lastSub = sub; bannerSub.textContent = sub; }
}
function startTimer() {
  const mins = +$('#iMin').value; store.set('min', mins);
  Object.assign(state.timer, { running: true, done: false, endAt: Date.now() + mins * 60000 });
  bannerTitle.textContent = $('#iText').value.trim() || 'Kurze Pause'; banner.classList.remove('done');
  if (A.ctx && A.fade) { A.fade.gain.cancelScheduledValues(A.ctx.currentTime); A.fade.gain.setValueAtTime(1, A.ctx.currentTime); }
  syncTimerBtn();
}
function cancelTimer() { Object.assign(state.timer, { running: false, done: false }); bannerTitle.textContent = $('#iText').value.trim() || 'Kurze Pause'; banner.classList.remove('done'); syncTimerBtn(); }
function finishTimer() {
  Object.assign(state.timer, { running: false, done: true });
  bannerTitle.textContent = 'Weiter geht’s!'; banner.classList.add('done');
  state.forceWave = time + 7; burstConfetti(); face.set('happy', 4);
  if (A.playing) {
    const t = A.ctx.currentTime; A.fade.gain.setValueAtTime(1, t); A.fade.gain.linearRampToValueAtTime(0, t + 7);
    setTimeout(() => { if (state.timer.done) { stop(); A.fade.gain.cancelScheduledValues(A.ctx.currentTime); A.fade.gain.setValueAtTime(1, A.ctx.currentTime); } }, 7200);
  }
  syncTimerBtn();
}
function syncTimerBtn() {
  const b = $('#btnTimer'), r = state.timer.running;
  b.textContent = r ? 'Timer stoppen' : (state.timer.done ? 'Neu starten' : 'Timer starten'); b.setAttribute('aria-pressed', r);
}

/* ------------------------------------------------------------------ UI */
function syncUI() {
  document.body.classList.toggle('playing', A.playing);
  $('#btnPlay').setAttribute('aria-label', A.playing ? 'Musik pausieren' : 'Musik starten');
  $$('[data-style]').forEach(b => b.setAttribute('aria-pressed', b.dataset.style === A.style));
  $$('[data-move]').forEach(b => b.setAttribute('aria-pressed', b.dataset.move === state.move));
  $$('[data-fx]').forEach(b => b.setAttribute('aria-pressed', !!state.fx[b.dataset.fx]));
  $('#npStyle').textContent = STYLES[A.style].label; $('#npBpm').textContent = A.bpm;
  if (!A.playing) { $('#npBar').textContent = '–'; $('#npPart').textContent = ''; }
  $('#btnMix').setAttribute('aria-pressed', !!A.autoMix);
  $('#btnSet').setAttribute('aria-pressed', !!A.set);
  $('#btnNext').disabled = !A.set || !A.playing;
  document.body.style.setProperty('--bpm', A.bpm);
  $$('[data-scene]').forEach(b => b.setAttribute('aria-pressed', b.dataset.scene === curScene));
  const wb = document.querySelector('[data-fx="wall"]'); wb.disabled = curScene !== 'club'; wb.title = curScene === 'club' ? 'W' : 'Nur im Club';
  $('#btnLogoX').hidden = !deskCfg.img;
}
function setScene(k) { applyScene(k); store.set('scene', k); syncUI(); }
function loadLogo(src, save) {
  const im = new Image();
  im.onload = () => {
    const w0 = im.width || 640, h0 = im.height || 220, k = Math.min(1, 640 / w0, 220 / h0), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w0 * k)); c.height = Math.max(1, Math.round(h0 * k));
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    deskCfg.img = c; drawLogo(); syncUI();
    if (save) store.set('logo', c.toDataURL('image/png'));
  };
  im.src = src;
}
function setStyle(k) {
  A.style = k; A.bpm = STYLES[k].bpm; $('#sTempo').value = A.bpm; $('#oTempo').textContent = A.bpm; store.set('style', k);
  if (A.ctx) applyFilter(); syncUI();
}
function setMove(m) { state.move = m; if (m === 'auto') state.autoMove = 'dj'; state.forceWave = 0; syncUI(); }
function toggleFx(k) { if ((k === 'strobe' && RM) || (k === 'wall' && curScene !== 'club')) return; state.fx[k] = !state.fx[k]; syncUI(); }
function togglePlay() { A.playing ? stop() : play(); }
function toggleStage() { document.body.classList.toggle('stage'); measure(); wake(); }
function toggleFull() {
  const d = document;
  if (d.fullscreenElement) d.exitFullscreen().catch(() => {});
  else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => {});
}
let wakeT = 0;
function wake() { document.body.classList.add('wake'); clearTimeout(wakeT); wakeT = setTimeout(() => document.body.classList.remove('wake'), 2500); }

$('#btnPlay').addEventListener('click', togglePlay);
$$('[data-style]').forEach(b => b.addEventListener('click', () => { if (A.set) { A.set = false; store.set('set', false); } setStyle(b.dataset.style); }));
$$('[data-move]').forEach(b => b.addEventListener('click', () => setMove(b.dataset.move)));
$$('[data-fx]').forEach(b => b.addEventListener('click', () => toggleFx(b.dataset.fx)));
$$('[data-shot]').forEach(b => b.addEventListener('click', () => shot(b.dataset.shot)));
$('#sTempo').addEventListener('input', e => { A.bpm = +e.target.value; $('#oTempo').textContent = A.bpm; if (A.ctx) applyFilter(); syncUI(); });
$('#sVol').addEventListener('input', e => { A.vol = e.target.value / 100; $('#oVol').textContent = e.target.value + ' %'; if (A.master) A.master.gain.setTargetAtTime(A.vol, A.ctx.currentTime, 0.03); store.set('vol', +e.target.value); });
$('#sFilter').addEventListener('input', e => { A.filter = e.target.value / 100; const v = +e.target.value; $('#oFilter').textContent = Math.abs(v) < 3 ? 'aus' : (v < 0 ? 'TP ' : 'HP ') + Math.abs(v); applyFilter(); });
$('#sFilter').addEventListener('dblclick', e => { e.target.value = 0; e.target.dispatchEvent(new Event('input')); });
$('#iText').addEventListener('input', e => { if (!state.timer.done) bannerTitle.textContent = e.target.value.trim() || 'Kurze Pause'; store.set('text', e.target.value); });
$$('[data-scene]').forEach(b => b.addEventListener('click', () => setScene(b.dataset.scene)));
$('#iDesk').addEventListener('input', e => { deskCfg.text = e.target.value.trim() || 'ROBO DJ'; drawLogo(); store.set('desk', e.target.value); });
$('#btnLogo').addEventListener('click', () => $('#iLogo').click());
$('#iLogo').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => loadLogo(rd.result, true); rd.readAsDataURL(f); e.target.value = ''; });
$('#btnLogoX').addEventListener('click', () => { deskCfg.img = null; drawLogo(); store.set('logo', null); syncUI(); });
function toggleSet() { A.set = !A.set; store.set('set', A.set); A.trackNo = -1; syncUI(); }
$('#btnSet').addEventListener('click', toggleSet);
$('#btnNext').addEventListener('click', () => { A.skip = true; });
$('#btnMix').addEventListener('click', () => { A.autoMix = !A.autoMix; store.set('mix', A.autoMix); syncUI(); });
$('#btnTimer').addEventListener('click', () => (state.timer.running ? cancelTimer() : startTimer()));
$('#btnFull').addEventListener('click', toggleFull);
$('#btnHide').addEventListener('click', toggleStage);
$('#btnPeek').addEventListener('click', toggleStage);
addEventListener('pointermove', e => { pointer.x = (e.clientX / innerWidth) * 2 - 1; pointer.y = (e.clientY / innerHeight) * 2 - 1; if (document.body.classList.contains('stage')) wake(); });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
canvas.addEventListener('pointerdown', e => {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.intersectObjects(robotMeshes, false).length) {
    initAudio(); A.ctx.resume(); boop(A.ctx.currentTime + 0.01);
    face.set(Math.random() < 0.5 ? 'love' : 'happy', 1.4); antV += 6;
  }
});
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,select,textarea')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const moves = ['auto', 'dj', 'hands', 'robot', 'headbang', 'spin', 'wave', 'fever'];
  if (k === ' ') { if (e.target.closest && e.target.closest('button')) return; e.preventDefault(); togglePlay(); }
  else if (/^[1-8]$/.test(k)) setMove(moves[+k - 1]);
  else if (k === 'g') setScene(SCENE_ORDER[(SCENE_ORDER.indexOf(curScene) + 1) % SCENE_ORDER.length]);
  else if (k === 'l') toggleFx('lasers'); else if (k === 'd') toggleFx('disco'); else if (k === 'n') toggleFx('fog');
  else if (k === 's') toggleFx('lights'); else if (k === 'w') toggleFx('wall'); else if (k === 'b') toggleFx('strobe');
  else if (k === 'k') shot('confetti'); else if (k === 'a') shot('horn'); else if (k === 'x') shot('scratch'); else if (k === 'r') shot('drop');
  else if (k === 'j') toggleSet();
  else if (k === '.') { if (A.set && A.playing) A.skip = true; }
  else if (k === 'm') { A.autoMix = !A.autoMix; store.set('mix', A.autoMix); syncUI(); }
  else if (k === 'f') toggleFull(); else if (k === 'h' || (k === 'escape' && document.body.classList.contains('stage'))) toggleStage();
});

// restore per-viewer preferences
{
  const st = store.get('style', 'house'); if (STYLES[st]) setStyle(st);
  const v = store.get('vol', 75); $('#sVol').value = v; A.vol = v / 100; $('#oVol').textContent = v + ' %';
  const tx = store.get('text', null); if (typeof tx === 'string') { $('#iText').value = tx; bannerTitle.textContent = tx.trim() || 'Kurze Pause'; }
  const sc = store.get('scene', 'club'); if (SCENES[sc]) applyScene(sc);
  const dk = store.get('desk', null); if (typeof dk === 'string') { $('#iDesk').value = dk; deskCfg.text = dk.trim() || 'ROBO DJ'; drawLogo(); }
  const lg = store.get('logo', null); if (typeof lg === 'string' && lg.startsWith('data:image/')) loadLogo(lg, false);
  A.autoMix = store.get('mix', false) === true;
  A.set = store.get('set', true) !== false;
  const mn = store.get('min', 10); if ([5, 10, 15, 20, 30].includes(mn)) $('#iMin').value = mn;
}
if (RM) { const b = $('#btnStrobe'); b.disabled = true; b.title = 'Bei reduzierter Bewegung deaktiviert'; }
syncUI(); syncTimerBtn();
resize();
requestAnimationFrame(t => { last = t; frame(t); });
})();
